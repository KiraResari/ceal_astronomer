name: ceal_astronomer
description: "A flutter project for tracking the astronomical objects of fictional solar systems"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  file_selector: ^1.1.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/CealAstronomerIcon.png"
  adaptive_icon_foreground: "assets/images/CealAstronomerIcon.png"
  adaptive_icon_background: "#ffffff"
  windows:
    generate: true
    image_path: "assets/images/CealAstronomerIcon.png"
    icon_size: 256
